pre-commit:
  parallel: false
  jobs:
    - name: Biome check
      run: bun --bun run biome:check
      stage_fixed: true
    - name: Astro check
      run: bun --bun run astro:check

commit-msg:
  jobs:
    - name: Conventional commit message
      run: bun --bun run commitlint -- --edit {1}

pre-push:
  jobs:
    - name: Build
      run: bun --bun run build
